name: 'CleanCloud Scan'
description: 'Scan your cloud environment for waste and hygiene issues across AWS, Azure, and GCP'
author: 'Suresh Mandalapu'

branding:
  icon: 'search'
  color: 'green'

inputs:
  provider:
    description: 'Cloud provider to scan: aws, azure, or gcp'
    required: true
  region:
    description: 'Specific region or location to scan'
    required: false
    default: ''
  category:
    description: 'Rule category to run: hygiene (default), ai (SageMaker + EC2 GPU on AWS, AML Compute on Azure, Vertex AI on GCP), or all (hygiene + AI)'
    required: false
    default: ''
  all-regions:
    description: 'Scan all regions with resources (AWS only)'
    required: false
    default: 'false'
  fail-on-confidence:
    description: 'Fail if findings at or above this confidence level exist: LOW, MEDIUM, or HIGH'
    required: false
    default: ''
  fail-on-cost:
    description: 'Fail if estimated monthly waste exceeds this USD amount'
    required: false
    default: ''
  fail-on-findings:
    description: 'Fail on any finding'
    required: false
    default: 'false'
  output:
    description: 'Output format: human, json, csv, or markdown'
    required: false
    default: 'human'
  output-file:
    description: 'Path to write output file (required for json/csv, optional for markdown)'
    required: false
    default: ''
  org:
    description: 'Auto-discover and scan all accounts in your AWS Organization (AWS only). Requires organizations:ListAccounts on the hub role.'
    required: false
    default: 'false'
  accounts:
    description: 'AWS account IDs to scan, comma-separated (AWS only). Example: 111111111111,222222222222'
    required: false
    default: ''
  multi-account:
    description: 'Path to accounts config file for multi-account scanning (AWS only). Example: .cleancloud/accounts.yaml'
    required: false
    default: ''
  role-name:
    description: 'IAM role name to assume in each spoke account (AWS multi-account only). Defaults to CleanCloudReadOnlyRole.'
    required: false
    default: ''
  external-id:
    description: 'External ID for cross-account role assumption, if required by the spoke trust policy (AWS multi-account only).'
    required: false
    default: ''
  concurrency:
    description: 'Number of AWS accounts to scan in parallel (AWS multi-account only). Keep low to avoid API throttling.'
    required: false
    default: ''
  timeout:
    description: 'Total scan timeout in seconds across all accounts (AWS multi-account only).'
    required: false
    default: ''
  per-account-regions:
    description: 'Detect active regions per account instead of once on the hub. Slower but accurate if accounts use different regions (AWS multi-account only).'
    required: false
    default: 'false'
  artifact-name:
    description: 'Upload the output file as a GitHub Actions artifact with this name. Leave empty to skip upload.'
    required: false
    default: ''
  config:
    description: 'Path to cleancloud.yaml config file. If omitted, auto-detected from repo root.'
    required: false
    default: ''
  explain:
    description: 'Print suppression reason for each filtered finding. Useful for debugging policy config in CI.'
    required: false
    default: 'false'
  skip:
    description: 'Skip rules by ID. Comma-separated. Example: aws.ec2.ami.old,aws.resource.untagged'
    required: false
    default: ''
  ignore-tag:
    description: 'Ignore findings by tag. Comma-separated key or key:value pairs. Example: env:dev,temporary'
    required: false
    default: ''
  subscription:
    description: 'Azure subscription ID(s) to scan, comma-separated. Omit to scan all accessible subscriptions.'
    required: false
    default: ''
  management-group:
    description: 'Azure Management Group ID — auto-discovers all subscriptions underneath.'
    required: false
    default: ''
  project:
    description: 'GCP project ID(s) to scan, comma-separated. Omit to use the default project from credentials.'
    required: false
    default: ''
  all-projects:
    description: 'Scan all accessible GCP projects (GCP only).'
    required: false
    default: 'false'
  version:
    description: 'CleanCloud version to install (e.g. 1.7.2). Defaults to latest.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install CleanCloud
      shell: bash
      env:
        CLEANCLOUD_VERSION: ${{ inputs.version }}
        CLEANCLOUD_PROVIDER: ${{ inputs.provider }}
      run: |
        EXTRA="${CLEANCLOUD_PROVIDER:-all}"
        if [ -n "$CLEANCLOUD_VERSION" ]; then
          pip install --upgrade "cleancloud[${EXTRA}]==$CLEANCLOUD_VERSION"
        else
          pip install --upgrade "cleancloud[${EXTRA}]"
        fi

    - name: Run CleanCloud scan
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_ALL_REGIONS: ${{ inputs.all-regions }}
        INPUT_FAIL_ON_CONFIDENCE: ${{ inputs.fail-on-confidence }}
        INPUT_FAIL_ON_COST: ${{ inputs.fail-on-cost }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_ACCOUNTS: ${{ inputs.accounts }}
        INPUT_MULTI_ACCOUNT: ${{ inputs.multi-account }}
        INPUT_ROLE_NAME: ${{ inputs.role-name }}
        INPUT_EXTERNAL_ID: ${{ inputs.external-id }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_PER_ACCOUNT_REGIONS: ${{ inputs.per-account-regions }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXPLAIN: ${{ inputs.explain }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_IGNORE_TAG: ${{ inputs.ignore-tag }}
        INPUT_SUBSCRIPTION: ${{ inputs.subscription }}
        INPUT_MANAGEMENT_GROUP: ${{ inputs.management-group }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_ALL_PROJECTS: ${{ inputs.all-projects }}
      run: |
        set -euo pipefail

        # Helpers
        is_true()   { [ "${1,,}" = "true" ]; }
        is_number() { [[ "$1" =~ ^[0-9]+$ ]]; }

        # Validate: provider
        case "$INPUT_PROVIDER" in
          aws|azure|gcp) ;;
          *) echo "::error::provider must be 'aws', 'azure', or 'gcp'"; exit 1 ;;
        esac

        # Validate: category
        case "$INPUT_CATEGORY" in
          ""|hygiene|ai|all) ;;
          *) echo "::error::Invalid category value: '$INPUT_CATEGORY'. Must be hygiene, ai, or all"; exit 1 ;;
        esac

        # Validate: AWS-only inputs not used with non-AWS providers
        if [ "$INPUT_PROVIDER" != "aws" ]; then
          is_true "$INPUT_ALL_REGIONS"         && { echo "::error::all-regions is only valid for AWS"; exit 1; }
          is_true "$INPUT_ORG"                 && { echo "::error::org is only valid for AWS"; exit 1; }
          [ -n "$INPUT_ACCOUNTS" ]             && { echo "::error::accounts is only valid for AWS"; exit 1; }
          [ -n "$INPUT_MULTI_ACCOUNT" ]        && { echo "::error::multi-account is only valid for AWS"; exit 1; }
          [ -n "$INPUT_ROLE_NAME" ]            && { echo "::error::role-name is only valid for AWS"; exit 1; }
          [ -n "$INPUT_EXTERNAL_ID" ]          && { echo "::error::external-id is only valid for AWS"; exit 1; }
          [ -n "$INPUT_CONCURRENCY" ]          && { echo "::error::concurrency is only valid for AWS"; exit 1; }
          [ -n "$INPUT_TIMEOUT" ]              && { echo "::error::timeout is only valid for AWS"; exit 1; }
          is_true "$INPUT_PER_ACCOUNT_REGIONS" && { echo "::error::per-account-regions is only valid for AWS"; exit 1; }
        fi

        # Validate: Azure-only inputs not used with non-Azure providers
        if [ "$INPUT_PROVIDER" != "azure" ]; then
          [ -n "$INPUT_SUBSCRIPTION" ]     && { echo "::error::subscription is only valid for Azure"; exit 1; }
          [ -n "$INPUT_MANAGEMENT_GROUP" ] && { echo "::error::management-group is only valid for Azure"; exit 1; }
        fi

        # Validate: GCP-only inputs not used with non-GCP providers
        if [ "$INPUT_PROVIDER" != "gcp" ]; then
          [ -n "$INPUT_PROJECT" ]        && { echo "::error::project is only valid for GCP"; exit 1; }
          is_true "$INPUT_ALL_PROJECTS"  && { echo "::error::all-projects is only valid for GCP"; exit 1; }
        fi

        # Validate: GCP project and all-projects are mutually exclusive
        if [ "$INPUT_PROVIDER" = "gcp" ] && [ -n "$INPUT_PROJECT" ] && is_true "$INPUT_ALL_PROJECTS"; then
          echo "::error::Cannot use project and all-projects together"
          exit 1
        fi

        # Validate: AWS multi-account modes are mutually exclusive
        AWS_MULTI_COUNT=0
        is_true "$INPUT_ORG"       && ((AWS_MULTI_COUNT++)) || true
        [ -n "$INPUT_ACCOUNTS" ]   && ((AWS_MULTI_COUNT++)) || true
        [ -n "$INPUT_MULTI_ACCOUNT" ] && ((AWS_MULTI_COUNT++)) || true
        if [ "$AWS_MULTI_COUNT" -gt 1 ]; then
          echo "::error::Use only one of: org, accounts, or multi-account"
          exit 1
        fi

        # Validate: Azure subscription and management-group are mutually exclusive
        if [ -n "$INPUT_SUBSCRIPTION" ] && [ -n "$INPUT_MANAGEMENT_GROUP" ]; then
          echo "::error::Cannot use subscription and management-group together"
          exit 1
        fi

        # Validate: numeric inputs
        if [ -n "$INPUT_CONCURRENCY" ]; then
          ! is_number "$INPUT_CONCURRENCY"    && { echo "::error::concurrency must be a positive integer"; exit 1; }
          [ "$INPUT_CONCURRENCY" -le 0 ]      && { echo "::error::concurrency must be greater than 0"; exit 1; }
        fi
        if [ -n "$INPUT_TIMEOUT" ]; then
          ! is_number "$INPUT_TIMEOUT"        && { echo "::error::timeout must be a positive integer"; exit 1; }
          [ "$INPUT_TIMEOUT" -le 0 ]          && { echo "::error::timeout must be greater than 0"; exit 1; }
        fi

        # Validate: output-file required for json/csv
        if [[ "$INPUT_OUTPUT" =~ ^(json|csv)$ ]] && [ -z "$INPUT_OUTPUT_FILE" ]; then
          echo "::error::output-file is required when output is json or csv"
          exit 1
        fi

        # Validate: fail-on-confidence value
        case "$INPUT_FAIL_ON_CONFIDENCE" in
          ""|LOW|MEDIUM|HIGH) ;;
          *) echo "::error::Invalid fail-on-confidence value: '$INPUT_FAIL_ON_CONFIDENCE'. Must be LOW, MEDIUM, or HIGH"; exit 1 ;;
        esac

        # Log scan intent
        if [ "$INPUT_PROVIDER" = "azure" ]; then
          echo "Provider: Azure"
          if [ -n "$INPUT_MANAGEMENT_GROUP" ]; then
            echo "Mode: Management Group ($INPUT_MANAGEMENT_GROUP)"
          elif [ -n "$INPUT_SUBSCRIPTION" ]; then
            echo "Mode: Explicit subscriptions ($INPUT_SUBSCRIPTION)"
          else
            echo "Mode: All accessible subscriptions"
          fi
        elif [ "$INPUT_PROVIDER" = "aws" ]; then
          echo "Provider: AWS"
          if is_true "$INPUT_ORG"; then
            echo "Mode: AWS Organization (auto-discovery)"
          elif [ -n "$INPUT_ACCOUNTS" ]; then
            echo "Mode: Explicit accounts ($INPUT_ACCOUNTS)"
          elif [ -n "$INPUT_MULTI_ACCOUNT" ]; then
            echo "Mode: Config file ($INPUT_MULTI_ACCOUNT)"
          else
            echo "Mode: Single account"
          fi
        elif [ "$INPUT_PROVIDER" = "gcp" ]; then
          echo "Provider: GCP"
          if is_true "$INPUT_ALL_PROJECTS"; then
            echo "Mode: All accessible projects"
          elif [ -n "$INPUT_PROJECT" ]; then
            echo "Mode: Explicit projects ($INPUT_PROJECT)"
          else
            echo "Mode: Default project from credentials"
          fi
        fi

        ARGS=(scan --provider "$INPUT_PROVIDER")

        [ -n "$INPUT_CATEGORY" ]             && ARGS+=(--category "$INPUT_CATEGORY")
        is_true "$INPUT_ALL_REGIONS"         && ARGS+=(--all-regions)
        [ -n "$INPUT_REGION" ]               && ARGS+=(--region "$INPUT_REGION")
        is_true "$INPUT_ORG"                 && ARGS+=(--org)
        [ -n "$INPUT_ACCOUNTS" ]             && ARGS+=(--accounts "$INPUT_ACCOUNTS")
        [ -n "$INPUT_MULTI_ACCOUNT" ]        && ARGS+=(--multi-account "$INPUT_MULTI_ACCOUNT")
        [ -n "$INPUT_ROLE_NAME" ]            && ARGS+=(--role-name "$INPUT_ROLE_NAME")
        [ -n "$INPUT_EXTERNAL_ID" ]          && ARGS+=(--external-id "$INPUT_EXTERNAL_ID")
        [ -n "$INPUT_CONCURRENCY" ]          && ARGS+=(--concurrency "$INPUT_CONCURRENCY")
        [ -n "$INPUT_TIMEOUT" ]              && ARGS+=(--timeout "$INPUT_TIMEOUT")
        is_true "$INPUT_PER_ACCOUNT_REGIONS" && ARGS+=(--per-account-regions)
        [ -n "$INPUT_CONFIG" ]               && ARGS+=(--config "$INPUT_CONFIG")
        is_true "$INPUT_EXPLAIN"             && ARGS+=(--explain)
        if [ -n "$INPUT_SKIP" ]; then
          IFS=',' read -ra SKIPS <<< "$INPUT_SKIP"
          for rule in "${SKIPS[@]}"; do
            rule=$(echo "$rule" | xargs)
            [ -z "$rule" ] && continue
            ARGS+=(--skip "$rule")
          done
        fi
        if [ -n "$INPUT_IGNORE_TAG" ]; then
          IFS=',' read -ra TAGS <<< "$INPUT_IGNORE_TAG"
          for tag in "${TAGS[@]}"; do
            tag=$(echo "$tag" | xargs)
            [ -z "$tag" ] && continue
            ARGS+=(--ignore-tag "$tag")
          done
        fi
        [ -n "$INPUT_FAIL_ON_CONFIDENCE" ]   && ARGS+=(--fail-on-confidence "$INPUT_FAIL_ON_CONFIDENCE")
        [ -n "$INPUT_FAIL_ON_COST" ]         && ARGS+=(--fail-on-cost "$INPUT_FAIL_ON_COST")
        is_true "$INPUT_FAIL_ON_FINDINGS"    && ARGS+=(--fail-on-findings)
        [ -n "$INPUT_OUTPUT" ]               && ARGS+=(--output "$INPUT_OUTPUT")
        [ -n "$INPUT_OUTPUT_FILE" ]          && ARGS+=(--output-file "$INPUT_OUTPUT_FILE")
        [ -n "$INPUT_MANAGEMENT_GROUP" ]     && ARGS+=(--management-group "$INPUT_MANAGEMENT_GROUP")
        if [ -n "$INPUT_SUBSCRIPTION" ]; then
          IFS=',' read -ra SUBS <<< "$INPUT_SUBSCRIPTION"
          for sub in "${SUBS[@]}"; do
            sub=$(echo "$sub" | xargs)
            [ -z "$sub" ] && continue
            ARGS+=(--subscription "$sub")
          done
        fi
        is_true "$INPUT_ALL_PROJECTS" && ARGS+=(--all-projects)
        if [ -n "$INPUT_PROJECT" ]; then
          IFS=',' read -ra PROJECTS <<< "$INPUT_PROJECT"
          for proj in "${PROJECTS[@]}"; do
            proj=$(echo "$proj" | xargs)
            [ -z "$proj" ] && continue
            ARGS+=(--project "$proj")
          done
        fi

        ARGS+=(--no-feedback)

        printf "Running: cleancloud"; printf " %q" "${ARGS[@]}"; echo

        echo "## CleanCloud Scan" >> "$GITHUB_STEP_SUMMARY"
        echo "**Provider:** $INPUT_PROVIDER" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if cleancloud "${ARGS[@]}"; then
          echo "Scan completed successfully." >> "$GITHUB_STEP_SUMMARY"
        else
          EXIT_CODE=$?
          echo "Scan failed." >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT_CODE
        fi

    - name: Upload CleanCloud report
      if: ${{ inputs.artifact-name != '' && inputs.output-file != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-file }}
